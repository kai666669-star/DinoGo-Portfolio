# SQL Server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# MVP simulated payment is enabled by default for the project demo.
# Set PAYMENT_SIMULATION_ENABLED=false when a real payment integration is deployed.
app.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:true}
app.payment-expiry.timeout-minutes=${PAYMENT_EXPIRY_TIMEOUT_MINUTES:15}
app.payment-expiry.enabled=${PAYMENT_EXPIRY_ENABLED:true}
app.payment-expiry.initial-delay-ms=${PAYMENT_EXPIRY_INITIAL_DELAY_MS:60000}
app.payment-expiry.fixed-delay-ms=${PAYMENT_EXPIRY_FIXED_DELAY_MS:60000}
app.ecpay.enabled=${ECPAY_ENABLED:false}
app.ecpay.merchant-id=${ECPAY_MERCHANT_ID:}
app.ecpay.hash-key=${ECPAY_HASH_KEY:}
app.ecpay.hash-iv=${ECPAY_HASH_IV:}
app.ecpay.checkout-url=${ECPAY_CHECKOUT_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
app.ecpay.return-url=${ECPAY_RETURN_URL:}
app.ecpay.order-result-url=${ECPAY_ORDER_RESULT_URL:}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate

# Debug SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.config.import=optional:classpath:application-local.properties


# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Sysmsg Email Dispatcher
sysmsg.email.enabled=${SYSMSG_EMAIL_ENABLED:false}
sysmsg.email.batch-size=${SYSMSG_EMAIL_BATCH_SIZE:50}
sysmsg.email.poll-delay-ms=${SYSMSG_EMAIL_POLL_DELAY_MS:30000}
sysmsg.email.retry-delay-ms=${SYSMSG_EMAIL_RETRY_DELAY_MS:60000}

# Order event reconciliation repairs missed Review and Sysmsg AFTER_COMMIT events.
app.sysmsg.reconciliation.enabled=true
sysmsg.reconciliation.page-size=100
sysmsg.reconciliation.overlap-minutes=5
sysmsg.reconciliation.full-sweep-every-runs=60

# Password reset emails are account-security messages and do not use notification preferences.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.from=${EMAIL_FROM:service.dinogo@gmail.com}
app.password-reset.secret=${PASSWORD_RESET_SECRET}
app.password-reset.expiration-ms=${PASSWORD_RESET_EXPIRATION_MS:900000}
app.password-reset.rate-limit-window-ms=${PASSWORD_RESET_RATE_LIMIT_WINDOW_MS:60000}
app.password-reset.rate-limit-max-keys=${PASSWORD_RESET_RATE_LIMIT_MAX_KEYS:10000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
