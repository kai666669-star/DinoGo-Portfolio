name: dinogo

services:
  database:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    expose:
      - "1433"
    volumes:
      - db_data:/var/opt/mssql
    networks:
      - data

  backend:
    image: dinogo-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: "jdbc:sqlserver://database:1433;databaseName=0901;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-true}
      PAYMENT_EXPIRY_TIMEOUT_MINUTES: ${PAYMENT_EXPIRY_TIMEOUT_MINUTES:-15}
      PAYMENT_EXPIRY_ENABLED: "false"
      PAYMENT_EXPIRY_INITIAL_DELAY_MS: ${PAYMENT_EXPIRY_INITIAL_DELAY_MS:-60000}
      PAYMENT_EXPIRY_FIXED_DELAY_MS: ${PAYMENT_EXPIRY_FIXED_DELAY_MS:-60000}
      ECPAY_ENABLED: ${ECPAY_ENABLED:-false}
      ECPAY_MERCHANT_ID: ${ECPAY_MERCHANT_ID:-}
      ECPAY_HASH_KEY: ${ECPAY_HASH_KEY:-}
      ECPAY_HASH_IV: ${ECPAY_HASH_IV:-}
      ECPAY_CHECKOUT_URL: ${ECPAY_CHECKOUT_URL:-https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
      ECPAY_RETURN_URL: ${ECPAY_RETURN_URL:-}
      ECPAY_ORDER_RESULT_URL: ${ECPAY_ORDER_RESULT_URL:-}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-service.dinogo@gmail.com}
      SYSMSG_EMAIL_ENABLED: "false"
      SYSMSG_EMAIL_BATCH_SIZE: ${SYSMSG_EMAIL_BATCH_SIZE:-50}
      SYSMSG_EMAIL_POLL_DELAY_MS: ${SYSMSG_EMAIL_POLL_DELAY_MS:-30000}
      SYSMSG_EMAIL_RETRY_DELAY_MS: ${SYSMSG_EMAIL_RETRY_DELAY_MS:-60000}
      SYSMSG_EMAIL_MAX_ATTEMPTS: ${SYSMSG_EMAIL_MAX_ATTEMPTS:-5}
      SYSMSG_RECONCILIATION_ENABLED: ${SYSMSG_RECONCILIATION_ENABLED:-false}
      SYSMSG_RECONCILIATION_PAGE_SIZE: ${SYSMSG_RECONCILIATION_PAGE_SIZE:-100}
      SYSMSG_RECONCILIATION_FIXED_DELAY_MS: ${SYSMSG_RECONCILIATION_FIXED_DELAY_MS:-60000}
      SYSMSG_OA_BATCH_SIZE: ${SYSMSG_OA_BATCH_SIZE:-100}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-}
      PASSWORD_RESET_EXPIRATION_MS: ${PASSWORD_RESET_EXPIRATION_MS:-900000}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MS: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MS:-60000}
      PASSWORD_RESET_RATE_LIMIT_MAX_KEYS: ${PASSWORD_RESET_RATE_LIMIT_MAX_KEYS:-10000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_AI_OPENAI_ENABLED: ${APP_AI_OPENAI_ENABLED:-false}
      APP_AI_OPENAI_MODEL: ${APP_AI_OPENAI_MODEL:-gpt-4.1-mini}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${DB_URL:?DB_URL is required}"
        : "$${DB_USERNAME:?DB_USERNAME is required}"
        : "$${DB_PASSWORD:?DB_PASSWORD is required}"
        : "$${JWT_SECRET:?JWT_SECRET is required}"
        : "$${PASSWORD_RESET_SECRET:?PASSWORD_RESET_SECRET is required}"
        : "$${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}"
        if [ "$${ECPAY_ENABLED:-false}" = "true" ]; then
          : "$${ECPAY_MERCHANT_ID:?ECPAY_MERCHANT_ID is required when ECPAY is enabled}"
          : "$${ECPAY_HASH_KEY:?ECPAY_HASH_KEY is required when ECPAY is enabled}"
          : "$${ECPAY_HASH_IV:?ECPAY_HASH_IV is required when ECPAY is enabled}"
        fi
        exec java -jar /app/app.jar
    depends_on:
      database:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
    networks:
      edge:
        gw_priority: 1
      data: {}

  frontend:
    image: dinogo-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    expose:
      - "80"
    networks:
      - edge

  reverse-proxy:
    image: caddy:2.11.4-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - edge

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
